name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: The generated specification is current
        run: npm run spec:check
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t ppro-app-youcam-beauty-advisor .
      - name: The container starts, answers and serves the web app
        run: |
          docker run -d --name app -p 8787:8787 \
            -e PPRO_SIGNING_SECRET="$(openssl rand -base64 36)" \
            -e PPRO_HOST_KEY="$(openssl rand -base64 36)" \
            -e PPRO_PUBLIC_URL=http://localhost:8787 \
            ppro-app-youcam-beauty-advisor
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/ppro/v1/health; then break; fi
            if [ "$i" = 30 ]; then docker logs app; exit 1; fi
            sleep 1
          done
          echo
          curl -fsS http://localhost:8787/.well-known/ppro-app.json | grep -q '"protocol":"ppro-app/1"'
          curl -fsS http://localhost:8787/ | grep -qi '<div id="root">'

  browser:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
