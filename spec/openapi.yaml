# Generated by `npm run spec:build` from the code. Do not edit by hand.
openapi: "3.1.0"
info:
  title: PPRO App API
  version: "1.0.0"
  summary: How an external agent controls a Populi Professional app.
  description: "Protocol `ppro-app/1`. This document describes the beauty advisor app (YouCam Beauty Advisor); the envelope (sessions, events, messages, photos, UI state) is the same for every ppro-app, and the tool catalog is per app: 18 tools here, listed with their JSON Schemas in the manifest."
  license:
    name: MIT
    identifier: MIT
servers:
  - url: "{origin}"
    description: Your deployment of the app.
    variables:
      origin:
        default: "https://beauty-advisor.invalid"
tags:
  - name: discovery
    description: What the app is and what it can do.
  - name: host
    description: Creating sessions and minting tokens. Server side only.
  - name: agent
    description: "What the advisor does: tools, messages, listening."
  - name: client
    description: "What the client's browser does: consent, photos, UI events."
paths:
  "/.well-known/ppro-app.json":
    get:
      operationId: getManifest
      tags:
        - discovery
      summary: Discover the app
      description: |-
        The app's manifest: what it is, its screens and targets, its tools with JSON Schemas, its events and the rules its advisor follows. Also served at `/ppro/v1/manifest`.

        No authentication.
      security: []
      responses:
        "200":
          description: The manifest.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Manifest"
  "/ppro/v1/manifest":
    get:
      operationId: getManifestAlias
      tags:
        - discovery
      summary: Discover the app (alias)
      description: |-
        The same manifest as `/.well-known/ppro-app.json`, under the API prefix for clients that only know the API base.

        No authentication.
      security: []
      responses:
        "200":
          description: The manifest.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Manifest"
  "/ppro/v1/health":
    get:
      operationId: getHealth
      tags:
        - discovery
      summary: Liveness and engine mode
      description: No authentication.
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
  "/ppro/v1/sessions":
    post:
      operationId: createSession
      tags:
        - host
      summary: Create a session
      description: |-
        Called by the host. Returns a token for the advisor, a token for the client's browser and a launch URL whose fragment carries the client token.

        Roles: host.
      security:
        - bearer: []
      responses:
        "201":
          description: The session.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CreatedSession"
        "401":
          description: Missing or wrong host key.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: Invalid body.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateSessionRequest"
  "/ppro/v1/demo/session":
    post:
      operationId: createDemoSession
      tags:
        - discovery
      summary: Start a standalone demo session
      description: |-
        Only when the server runs standalone (`capabilities.standalone`). No authentication; rate limited. Returns both tokens so a developer can connect an agent. Disabled in production unless PPRO_STANDALONE is set.

        No authentication.
      security: []
      responses:
        "201":
          description: The session.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CreatedSession"
        "404":
          description: Standalone sessions are off.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: Too many demo sessions.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/DemoSessionRequest"
  "/ppro/v1/sessions/{id}":
    get:
      operationId: getSession
      tags:
        - client
      summary: Read the session
      description: |-
        A snapshot: state, transcript tail, budget, UI and presence. The advisor persona is omitted for the client. `?messages=N` sets how many recent messages (default 100, at most 300).

        Roles: host, agent, client.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
        - name: messages
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 300
      responses:
        "200":
          description: The snapshot.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Session"
        "401":
          description: Unauthenticated.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: No such session for this token.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      operationId: endSession
      tags:
        - client
      summary: End the consultation
      description: |-
        Deletes the client's photos and every image made from them. The transcript stays readable for a few minutes.

        Roles: host, agent, client.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
      responses:
        "200":
          description: The ended session.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Session"
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/ppro/v1/sessions/{id}/tokens":
    post:
      operationId: mintToken
      tags:
        - host
      summary: Mint a replacement token
      description: |-
        Host only. For example, a fresh launch link after the client lost theirs.

        Roles: host.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
      responses:
        "200":
          description: The token.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MintedToken"
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/MintTokenRequest"
  "/ppro/v1/sessions/{id}/events":
    get:
      operationId: getEvents
      tags:
        - client
      summary: Listen for changes
      description: |-
        Every change to a session is an event with a rising `rev`. Send `Accept: text/event-stream` for server-sent events (resume with `Last-Event-ID`), or use `?after=<rev>&wait=<seconds>` to long-poll for JSON. The `rev` in a JSON response is a safe place to resume from. A cursor older than the kept buffer returns `410 events_expired`: read the session and continue from its `rev`.

        Roles: host, agent, client.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
          description: Return events newer than this rev.
        - name: wait
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 25
          description: Seconds to wait for something new.
        - name: types
          in: query
          schema:
            type: string
          description: Comma-separated event types to include.
      responses:
        "200":
          description: "A batch of events (JSON), or a stream (`text/event-stream`)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EventBatch"
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "410":
          description: The cursor is older than the kept events.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/ppro/v1/sessions/{id}/messages":
    post:
      operationId: postMessage
      tags:
        - client
      summary: Send a chat message
      description: |-
        An agent token posts the advisor's message (links and markdown are removed; text that breaks the content rules is refused with `content_blocked`). A client token posts the client's. A host may relay the client's words with `role: "client"`.

        Roles: host, agent, client.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
      responses:
        "201":
          description: The message.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PostedMessage"
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: Blocked or invalid.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: Too many messages.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/MessageRequest"
  "/ppro/v1/sessions/{id}/presence":
    put:
      operationId: setPresence
      tags:
        - agent
      summary: Show what the advisor is doing
      description: "Roles: agent."
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
      responses:
        "200":
          description: The presence now shown.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PresenceReply"
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PresenceRequest"
  "/ppro/v1/sessions/{id}/instructions":
    get:
      operationId: getInstructions
      tags:
        - host
      summary: "The advisor's briefing"
      description: |-
        The rules, tools and current status for this session, as text for the advisor's system prompt. `?style=call` for spoken replies. Fetch it again as the status changes.

        Roles: host, agent.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
        - name: style
          in: query
          schema:
            type: string
            enum:
              - chat
              - call
      responses:
        "200":
          description: The briefing.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Instructions"
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/ppro/v1/sessions/{id}/tools":
    get:
      operationId: listTools
      tags:
        - host
      summary: "The tools in your framework's format"
      description: "Roles: host, agent."
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum:
              - native
              - openai
              - gemini
              - anthropic
      responses:
        "200":
          description: The tool declarations in the requested format.
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/ppro/v1/sessions/{id}/tools/{name}":
    post:
      operationId: callTool
      tags:
        - agent
      summary: Call a tool
      description: |-
        The body is the tool's arguments object (empty means `{}`). A tool that cannot do what was asked (no photo yet, budget spent, the provider refused the photo) answers `200` with `ok: false` and an `error.code`; only contract problems are HTTP errors. Send `Idempotency-Key` to make a retry safe: the same key and arguments replay the first result.

        Roles: agent.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "The outcome, successful or not."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ToolResponse"
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: No such tool.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Idempotency key reused with different arguments, or the session ended."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: Arguments do not match the schema.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: Too many tool calls.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        description: "The tool's arguments, per its `inputSchema` in the manifest."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ToolArguments"
  "/ppro/v1/sessions/{id}/consent":
    post:
      operationId: setConsent
      tags:
        - client
      summary: "Record the client's consent"
      description: "Roles: client."
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
      responses:
        "200":
          description: The consent now held.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ConsentReply"
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ConsentRequest"
  "/ppro/v1/sessions/{id}/photos":
    post:
      operationId: uploadPhoto
      tags:
        - client
      summary: Share a photo
      description: |-
        The request body is the image (JPEG, PNG or WebP, up to 10 MB). It is validated from its bytes, re-encoded without metadata and held in memory only. Requires consent.

        Roles: client.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
      responses:
        "201":
          description: The stored photo.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PhotoReply"
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Consent missing, or the photo limit reached."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          description: Too large.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "415":
          description: "Not a JPEG, PNG or WebP."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: "Unusable (too small, unreadable)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        description: The image bytes.
        content:
          "image/jpeg":
            schema:
              type: string
              format: binary
  "/ppro/v1/sessions/{id}/photos/{photoId}":
    delete:
      operationId: deletePhoto
      tags:
        - host
      summary: Delete a photo and everything made from it
      description: "Roles: host, client."
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
        - name: photoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/ppro/v1/sessions/{id}/ui-events":
    post:
      operationId: postUiEvent
      tags:
        - client
      summary: Report what the client did in the app
      description: "Roles: client."
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
      responses:
        "200":
          description: The UI state now.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/UiReply"
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UiEventRequest"
  "/ppro/v1/sessions/{id}/images/{imageId}":
    get:
      operationId: getImage
      tags:
        - client
      summary: Image bytes
      description: |-
        A photo or a result image. The client may always read them. The advisor may only if the session was created with `agent_vision`; otherwise `403 vision_disabled`. Hosts never can.

        Roles: agent, client.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A JPEG.
          content:
            "image/jpeg":
              schema:
                type: string
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Not allowed for this role or session.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: Gone or never existed.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/ppro/v1/sessions/{id}/transcript.txt":
    get:
      operationId: getTranscript
      tags:
        - host
      summary: The conversation as text
      description: "Roles: host, client."
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "A session id, or `current` for the session the token belongs to."
          schema:
            type: string
      responses:
        "200":
          description: Plain text.
          content:
            "text/plain":
              schema:
                type: string
        "401":
          description: "Missing, invalid or expired token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/mcp":
    post:
      operationId: mcp
      tags:
        - agent
      summary: Model Context Protocol endpoint
      description: |-
        The same tools over MCP (Streamable HTTP, protocol 2026-07-28 and the 2025 revisions). Authenticate with the advisor's token; it also selects the session, so tools take no session argument. Includes the `advisor_instructions` prompt.

        Roles: agent.
      security:
        - bearer: []
      responses:
        "200":
          description: A JSON-RPC response.
        "401":
          description: "Not the advisor's token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "The host key (creates sessions), the advisor's session token, or the client's session token. Never send a token in a query string."
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Session:
      type: object
      properties:
        id:
          type: string
        rev:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        phase:
          type: string
          enum:
            - active
            - ended
        createdAt:
          type: number
        expiresAt:
          type: number
        endedAt:
          type:
            - number
            - "null"
        endReason:
          anyOf:
            - type: string
              enum:
                - client
                - agent
                - host
                - expired
            - type: "null"
        advisor:
          type: object
          properties:
            name:
              type: string
            pronouns:
              type:
                - string
                - "null"
            persona:
              description: "Present for the host and the agent, never for the client."
              type:
                - string
                - "null"
          required:
            - name
            - pronouns
          additionalProperties: false
        client:
          type: object
          properties:
            displayName:
              type:
                - string
                - "null"
          required:
            - displayName
          additionalProperties: false
        consent:
          type: object
          properties:
            adult:
              type: boolean
            photoAnalysis:
              type: boolean
            at:
              type:
                - number
                - "null"
            source:
              anyOf:
                - type: string
                  enum:
                    - client
                    - host
                - type: "null"
          required:
            - adult
            - photoAnalysis
            - at
            - source
          additionalProperties: false
        options:
          type: object
          properties:
            agentVision:
              type: boolean
            locale:
              type: string
            hostOrigin:
              type:
                - string
                - "null"
            minutes:
              type: number
          required:
            - agentVision
            - locale
            - hostOrigin
            - minutes
          additionalProperties: false
        budget:
          type: object
          properties:
            unitsTotal:
              type: number
            unitsUsed:
              type: number
            unitsRemaining:
              type: number
          required:
            - unitsTotal
            - unitsUsed
            - unitsRemaining
          additionalProperties: false
        engine:
          type: object
          properties:
            mode:
              type: string
              enum:
                - live
                - simulated
                - unavailable
          required:
            - mode
          additionalProperties: false
        photos:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              at:
                type: number
              width:
                type: number
              height:
                type: number
              bytes:
                type: number
            required:
              - id
              - at
              - width
              - height
              - bytes
            additionalProperties: false
        messages:
          type: array
          items:
            type: object
            properties:
              seq:
                type: integer
                minimum: 1
                maximum: 9007199254740991
              at:
                type: number
              role:
                type: string
                enum:
                  - client
                  - agent
                  - tool
